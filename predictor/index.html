    <script id="render">
        renderTeam = (team, popover = 'right') => `
            <span data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-placement="${popover}" data-bs-content="${team.name}">${team.code}</span>
        `;
        renderRadio = (groupCode, i, team) => `
            <div class="form-check"><input class="form-check-input" type="radio" name="${groupCode}" id="${groupCode}${i}" value="${team.code.toLowerCase()}"><label class="form-check-label" for="${groupCode}${i}">${renderTeam(team)}</label></div>
        `;
        renderGroup = (group) => `
        <div class="card group">
            <div class="card-header"><span>GROUP ${group.code}</span></div>
            <div class="card-body">
                ${group.teams.map((teamCode, i) =>
            renderRadio(group.code, i, getTeam(teamCode))
        ).join("")}
            </div>
        </div>
        `;
        renderMatch = (page, i, match) => `
        <div class="match">
            ${renderTeam(getTeam(match[0]), 'left')}
            <div class="d-flex align-items-center gap-1">
                <input name="${2 * (page * 24 + i)}" type="number" min="0" max="9"></input>
                <span>-</span>
                <input name="${2 * (page * 24 + i) + 1}" type="number" min="0" max="9"></input>
            </div>
            ${renderTeam(getTeam(match[1]), 'right')}
        </div>
        `;
        renderGroups = () => groups.map(g => renderGroup(g)).join("");
        renderMatches = (page) => matches[page].map((m, i) => renderMatch(page, i, m)).join("");

        document.getElementById("group-container").innerHTML = renderGroups();
        document.getElementById("match-container-0").innerHTML = renderMatches(0);
        document.getElementById("match-container-1").innerHTML = renderMatches(1);
        document.getElementById("match-container-2").innerHTML = renderMatches(2);

    </script>
    <script id="init">
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')
        const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl))
        document.querySelectorAll("input[type='number']").forEach(i => i.addEventListener("input", () => {
            if (i.value.length > 1) i.value = 9;
            let nextElm = document.getElementsByName(parseInt(i.name) + 1)[0];
            if (parseInt(i.name) < 143) nextElm.focus();
            updateMsc();
        }));
        updateMsc = () => {
            let output = "msc ";
            Array.from(document.getElementsByClassName("match")).forEach(m => {
                output +=
                    m.getElementsByTagName("input")[0].value +
                    "-" +
                    m.getElementsByTagName("input")[1].value +
                    " ";
            })
            if (output.length === 73 * 4)
                document.getElementById("msc").value = output;
        }
        document.querySelectorAll("input[type='radio']").forEach(i => i.addEventListener("input", () => {
            updateGsc();
        }));
        updateGsc = () => {
            let output = "gsc ";
            Array.from(document.querySelectorAll("input[type='radio']:checked")).forEach(r => {
                output += r.value + " ";
            });
            if (output.length === 13 * 4)
                document.getElementById("gsc").value = output;
        }
    </script>
